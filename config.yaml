features:
  volatility_window: 20
  volume_window: 20

detector:
  window: 30
  z_threshold: 3.0
  top_k: 100
  score_weights:
    return: 0.60
    volume: 0.25
    volatility: 0.15

benchmark:
  synthetic_anomalies: 200
  series_length: 2500
  windows: [5, 10, 20, 30, 60, 90]
  thresholds: [2.0, 2.5, 3.0, 3.5]
  latency_days: 1

reporting:
  save_plots: true
  save_csv: true
  example_tickers: [AAPL, NVDA, TSLA, META, JPM]
  figures_dir: reports/figures
  summaries_dir: reports/summaries
